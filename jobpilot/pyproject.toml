[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpilot"
version = "0.1.0"
description = "AI job search and application assistant powered by Claude"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=1.8",
  "httpx>=0.27",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8", "playwright>=1.45"]

[project.scripts]
jobpilot = "jobpilot.cli:main"

[tool.setuptools.packages.find]
include = ["jobpilot*"]

[tool.setuptools.package-data]
jobpilot = ["examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
