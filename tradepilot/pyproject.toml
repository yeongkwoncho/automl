[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradepilot"
version = "0.1.0"
description = "Trade journal that reviews every decision and improves the strategy daily"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.8", "pydantic>=2.6", "PyYAML>=6.0"]

[project.optional-dependencies]
yfinance = ["yfinance>=0.2"]
dev = ["pytest>=8"]

[project.scripts]
tradepilot = "tradepilot.cli:main"

[tool.setuptools.packages.find]
include = ["tradepilot*"]

[tool.setuptools.package-data]
tradepilot = ["examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
